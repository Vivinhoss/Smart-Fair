<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira Inteligente</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #d4dce5 0%, #bdc9d6 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #e8eef5;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(81, 97, 102, 0.15);
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            color: #516166;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        .form,
        .filtro {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        input,
        select,
        button {
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #d0dae6;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            background: #f5f8fb;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #75CDE6;
            box-shadow: 0 0 0 3px rgba(117, 205, 230, 0.1);
        }

        input::placeholder {
            color: #adb5bd;
        }

        #nomeItem {
            flex: 2;
        }

        #quantidadeItem {
            flex: 0.8;
            width: 100px;
        }

        #categoriaItem {
            flex: 1.2;
            color: #516166;
            cursor: pointer;
        }

        button {
            background: #75CDE6;
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 500;
            padding: 12px 24px;
        }

        button:hover {
            background: #5fbdd6;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(117, 205, 230, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        #adicionarBtn {
            background: #75E6B4;
            color: #516166;
        }

        #adicionarBtn:hover {
            background: #5fd6a4;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-bottom: 24px;
            width: 100%;
            overflow-x: hidden;
        }

        li {
            display: grid;
            grid-template-columns: minmax(120px, 2fr) minmax(60px, 0.8fr) minmax(80px, 1fr) minmax(100px, 1.2fr) minmax(80px, 1fr) minmax(90px, auto);
            gap: 10px;
            align-items: center;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        li:hover {
            border-color: #d0dae6;
            box-shadow: 0 2px 8px rgba(81, 97, 102, 0.1);
        }

        li input,
        li select {
            border: 1px solid rgba(81, 97, 102, 0.2);
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 8px;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #f5f8fb;
        }

        li input:focus,
        li select:focus {
            border-color: #75CDE6;
        }

        li span {
            font-weight: 600;
            color: #516166;
            font-size: 15px;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .remover {
            background: #E59774;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            width: 90px;
        }

        .remover:hover {
            background: #d58564;
            transform: translateY(-1px);
        }

        .acoes {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        #limparLista {
            background: #516166;
        }

        #limparLista:hover {
            background: #415156;
        }

        #exportarPdf {
            background: #75E6B4;
            color: #516166;
        }

        #exportarPdf:hover {
            background: #5fd6a4;
        }

        h3 {
            color: #516166;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        .totais-categoria {
            margin-top: 16px;
            background: linear-gradient(135deg, #d8dfe8 0%, #cdd5df 100%);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #c0cad6;
        }

        .totais-categoria strong {
            color: #516166;
            font-size: 16px;
            display: block;
            margin-bottom: 12px;
        }

        .totais-categoria br + text {
            color: #516166;
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(81, 97, 102, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: #e8eef5;
            padding: 32px;
            border-radius: 16px;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(81, 97, 102, 0.25);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content p {
            color: #516166;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn-confirmar {
            background: #E59774;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-confirmar:hover {
            background: #d58564;
        }

        .btn-cancelar {
            background: #d0dae6;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            color: #516166;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-cancelar:hover {
            background: #bec9d6;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #516166;
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            box-shadow: 0 4px 16px rgba(81, 97, 102, 0.3);
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== FILTRO ===== */
        #filtroCategoria {
            flex: 1;
            color: #516166;
            cursor: pointer;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 24px;
            }

            .form {
                flex-direction: column;
            }

            #nomeItem,
            #quantidadeItem,
            #categoriaItem,
            #adicionarBtn {
                width: 100%;
            }

            li {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                overflow: hidden;
            }

            li input,
            li select {
                width: 100%;
                min-width: 0;
            }

            li span {
                grid-column: span 2;
                text-align: right;
                font-size: 16px;
                padding: 8px 0;
            }

            li button {
                grid-column: span 2;
                width: 100%;
            }

            .acoes {
                flex-direction: column;
            }

            .acoes button {
                width: 100%;
            }
        }

        @media (max-width: 900px) {
            li {
                grid-template-columns: minmax(100px, 1.5fr) minmax(50px, 0.6fr) minmax(70px, 0.8fr) minmax(90px, 1fr) minmax(70px, 0.8fr) minmax(80px, auto);
                gap: 8px;
                padding: 12px;
            }

            li input,
            li select {
                font-size: 13px;
                padding: 6px 10px;
            }

            .remover {
                font-size: 12px;
                padding: 6px 12px;
                width: 80px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Feira Inteligente</h1>

        <div class="form">
            <input id="nomeItem" placeholder="Nome do item">
            <input id="quantidadeItem" type="number" min="1" placeholder="Qtd">
            <select id="categoriaItem"></select>
            <button id="adicionarBtn">Adicionar Item</button>
        </div>

        <div class="filtro">
            <select id="filtroCategoria"></select>
        </div>

        <ul id="lista"></ul>

        <h3 id="totalGeral">Total da feira: R$ 0,00</h3>
        <div class="totais-categoria" id="totaisCategoria"></div>

        <div class="acoes">
            <button id="limparLista">Limpar Lista</button>
            <button id="exportarPdf">Exportar PDF</button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <p id="modalMsg"></p>
            <div class="modal-actions">
                <button class="btn-cancelar" id="cancelar">Cancelar</button>
                <button class="btn-confirmar" id="confirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script type="module">
        // ===== CONFIGURAÇÕES INICIAIS =====
        
        // Define a ordem de exibição das categorias na lista
        const ORDEM = [
            "Açougue/Carnes", "Padaria", "Limpeza/Higiene",
            "Hortifruti", "Comidas/Bebidas", "Outros"
        ];

        // Define as cores de fundo para cada categoria
        const CORES = {
            "Açougue/Carnes": "#f5d9d9",
            "Padaria": "#f5ead4",
            "Limpeza/Higiene": "#d4e8f5",
            "Hortifruti": "#d4f5e0",
            "Comidas/Bebidas": "#e8daf5",
            "Outros": "#e0e5ea"
        };

        // Carrega a lista salva do localStorage ou inicia vazia
        let itens = JSON.parse(localStorage.getItem("lista")) || [];
        
        // Variável para armazenar a ação do modal de confirmação
        let acao = null;

        // Referências aos elementos do DOM
        const modal = document.getElementById("modal");
        const toast = document.getElementById("toast");

        // ===== FUNÇÕES DE INTERFACE =====
        
        /**
         * Exibe uma mensagem toast (notificação temporária)
         * @param {string} msg - Mensagem a ser exibida
         */
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        /**
         * Abre o modal de confirmação
         * @param {string} msg - Mensagem de confirmação
         * @param {function} callback - Função a ser executada ao confirmar
         */
        function abrirModal(msg, callback) {
            document.getElementById("modalMsg").textContent = msg;
            acao = callback;
            modal.style.display = "flex";
        }

        // Botão de confirmar no modal executa a ação e fecha
        document.getElementById("confirmar").onclick = () => {
            acao?.();
            modal.style.display = "none";
        };

        // Botão de cancelar apenas fecha o modal
        document.getElementById("cancelar").onclick = () => modal.style.display = "none";

        /**
         * Salva a lista de itens no localStorage
         */
        function salvar() {
            localStorage.setItem("lista", JSON.stringify(itens));
        }

        /**
         * Formata um valor numérico para moeda brasileira (R$)
         * @param {number} v - Valor a ser formatado
         * @returns {string} Valor formatado em moeda
         */
        function moeda(v) {
            return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        }

        /**
         * Atualiza os totais gerais e por categoria na tela
         */
        function atualizarTotais() {
            let total = 0;
            let porCat = {};
            itens.forEach(i => {
                total += i.qtd * i.preco;
                porCat[i.categoria] = (porCat[i.categoria] || 0) + i.qtd * i.preco;
            });
            totalGeral.textContent = `Total da feira: ${moeda(total)}`;
            totaisCategoria.innerHTML = "<strong>Total por categoria:</strong><br>";
            Object.entries(porCat).forEach(([c, v]) => totaisCategoria.innerHTML += `${c}: ${moeda(v)}<br>`);
        }

        /**
         * Renderiza a lista de itens na tela
         * Ordena por categoria, calcula totais e aplica filtros
         */
        function render() {
            // Ordena itens pela ordem das categorias definida
            itens.sort((a, b) => ORDEM.indexOf(a.categoria) - ORDEM.indexOf(b.categoria));
            
            const lista = document.getElementById("lista");
            lista.innerHTML = "";
            
            // Itera sobre cada item da lista
            itens.forEach((i, idx) => {
                // Aplica filtro de categoria se selecionado
                if (filtroCategoria.value && i.categoria !== filtroCategoria.value) return;

                // Cria o elemento da linha do item
                const li = document.createElement("li");
                li.style.background = CORES[i.categoria];

                // Cria campos de input para nome e quantidade
                const nome = Object.assign(document.createElement("input"), { value: i.nome });
                const qtd = Object.assign(document.createElement("input"), { type: "number", value: i.qtd });
                
                // Campo de preço com formatação de moeda brasileira
                const preco = document.createElement("input");
                preco.type = "text";
                preco.value = i.preco.toFixed(2).replace('.', ',');
                preco.placeholder = "0,00";

                // Cria select de categoria
                const cat = document.createElement("select");
                ORDEM.forEach(c => cat.innerHTML += `<option ${c === i.categoria ? "selected" : ""}>${c}</option>`);

                // Cria span para exibir o total do item (qtd × preço)
                const span = document.createElement("span");
                span.textContent = moeda(i.qtd * i.preco);

                // Função para atualizar os dados do item
                const att = () => {
                    i.nome = nome.value;
                    i.qtd = +qtd.value;
                    // Converte o valor brasileiro (com vírgula) para decimal
                    const valorLimpo = preco.value.replace(/\./g, '').replace(',', '.');
                    i.preco = parseFloat(valorLimpo) || 0;
                    i.categoria = cat.value;
                    salvar();
                    span.textContent = moeda(i.qtd * i.preco);
                    atualizarTotais();
                };

                // Vincula eventos de atualização aos campos
                [nome, qtd].forEach(e => e.oninput = att);
                
                // Formatação especial para o campo de preço
                preco.oninput = () => {
                    let valor = preco.value.replace(/\D/g, ''); // Remove tudo que não é número
                    
                    if (valor.length === 0) {
                        preco.value = '';
                        att();
                        return;
                    }
                    
                    // Converte para número e verifica limite de 1 milhão (100000000 centavos)
                    const valorNumerico = parseInt(valor);
                    if (valorNumerico > 100000000) {
                        valor = '100000000'; // Limita a 1 milhão de reais
                    }
                    
                    // Separa reais e centavos (últimos 2 dígitos são centavos)
                    let reais = '0';
                    let centavos = '00';
                    
                    if (valor.length === 1) {
                        centavos = '0' + valor;
                    } else if (valor.length === 2) {
                        centavos = valor;
                    } else {
                        centavos = valor.slice(-2);
                        reais = valor.slice(0, -2);
                    }
                    
                    // Remove zeros à esquerda dos reais, mas mantém pelo menos um zero
                    reais = reais.replace(/^0+/, '') || '0';
                    
                    // Adiciona pontos de milhares
                    const reaisFormatado = reais.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                    
                    preco.value = `${reaisFormatado},${centavos}`;
                    att();
                };
                
                cat.onchange = att;

                // Cria botão de remover item
                const rm = document.createElement("button");
                rm.textContent = "Remover";
                rm.className = "remover";
                rm.onclick = () => abrirModal(`Remover "${i.nome}"?`, () => {
                    itens.splice(idx, 1);
                    salvar(); render();
                    showToast("Item removido");
                });

                // Adiciona todos os elementos à linha
                li.append(nome, qtd, preco, cat, span, rm);
                lista.appendChild(li);
            });

            // Atualiza os totais
            atualizarTotais();
        }

        // ===== EVENTOS DE BOTÕES =====
        
        /**
         * Evento do botão "Adicionar Item"
         * Valida os campos e adiciona um novo item à lista
         */
        adicionarBtn.onclick = () => {
            // Valida se o nome foi preenchido e quantidade é maior que zero
            if (!nomeItem.value || quantidadeItem.value <= 0) return;
            
            // Adiciona novo item com preço inicial zero
            itens.push({ 
                nome: nomeItem.value, 
                qtd: +quantidadeItem.value, 
                preco: 0, 
                categoria: categoriaItem.value 
            });
            
            // Limpa os campos de entrada
            nomeItem.value = ""; 
            quantidadeItem.value = "";
            
            // Salva e atualiza a tela
            salvar(); 
            render();
            showToast("Item adicionado");
        };

        /**
         * Permite adicionar item pressionando Enter nos campos
         */
        nomeItem.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                e.preventDefault();
                quantidadeItem.focus();
            }
        });

        quantidadeItem.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                e.preventDefault();
                categoriaItem.focus();
            }
        });

        categoriaItem.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                e.preventDefault();
                adicionarBtn.click();
            }
        });

        /**
         * Evento do botão "Limpar Lista"
         * Remove todos os itens após confirmação
         */
        limparLista.onclick = () => {
            // Verifica se a lista está vazia antes de mostrar o modal
            if (itens.length === 0) {
                showToast("A lista já está vazia");
                return;
            }
            abrirModal("Limpar toda a lista?", () => {
                itens = []; 
                salvar(); 
                render();
                showToast("Lista limpa");
            });
        };

        // ===== INICIALIZAÇÃO =====
        
        /**
         * Popula os selects de categoria com as opções disponíveis
         */
        ORDEM.forEach(c => {
            categoriaItem.innerHTML += `<option>${c}</option>`;
            filtroCategoria.innerHTML += `<option>${c}</option>`;
        });
        
        // Adiciona opção "Todas" no filtro
        filtroCategoria.innerHTML = "<option value=''>Todas as categorias</option>" + filtroCategoria.innerHTML;

        // Renderiza a lista inicial ao carregar a página
        render();

        // Evento para o filtro de categoria
        filtroCategoria.onchange = render;
    </script>

</body>

</html>
